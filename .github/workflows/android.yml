name: Android CI

on:
  push:
    branches:
      - main
      - meixing
      - mxvpn
      - mx
      - "release-branch/*"
  pull_request:
  # all PRs on all branches

jobs:
  build:
    runs-on: ubuntu-latest

    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    steps:
      - name: Check out code
        uses: actions/checkout@v3
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - name: Switch to Java 17 # Note: 17 is pre-installed on ubuntu-latest
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "17"

      # Clean should essentially be a no-op, but make sure that it works.
      - name: Clean
        run: make clean

      - name: Build APKs
        run: make tailscale-debug.apk

      #      - name: Run tests
      #        run: make test

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-debug-apk
          path: tailscale-debug.apk

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/mxvpn' || github.ref == 'refs/heads/meixing' || startsWith(github.ref, 'refs/heads/release-branch/'))

    permissions:
      contents: write

    steps:
      - name: Download APK from build job
        uses: actions/download-artifact@v4
        with:
          name: tailscale-debug-apk

      - name: Generate tag for release
        id: tag_generator
        run: echo "tag_name=nightly-$(date +'%Y%m%d%H%M')-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: tailscale-debug.apk
          tag_name: ${{ steps.tag_generator.outputs.tag_name }}
          prerelease: true
          generate_release_notes: true
