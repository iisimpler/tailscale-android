name: Android CI

on:
  push:
    branches:
      - main
      - meixing
      - mxvpn
      - mx_vpn
      - "release-branch/*"
  pull_request:
    # all PRs on all branches

jobs:
  build:
    runs-on: ubuntu-latest

    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: "go.mod"
      - name: Switch to Java 17 # Note: 17 is pre-installed on ubuntu-latest
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: "temurin"
          java-version: "17"

      # Clean should essentially be a no-op, but make sure that it works.
      - name: Clean
        run: make clean

      - name: Build APKs
        run: make tailscale-debug.apk

      - name: Build Release AAB
        run: make tailscale-release.aab

      #      - name: Run tests
      #        run: make test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            tailscale-debug.apk
            tailscale-release.aab

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    if: github.event_name == 'push'

    permissions:
      contents: write

    steps:
      - name: Download APK from build job
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Generate tag for release
        id: tag_generator
        run: echo "tag_name=nightly-$(date +'%Y%m%d%H%M')-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tailscale-debug.apk
            tailscale-release.aab
          tag_name: ${{ steps.tag_generator.outputs.tag_name }}
          prerelease: true
          generate_release_notes: true
